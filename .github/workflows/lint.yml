name: Lint

on:
  push:
    branches:
      - main
      - week/**
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Nutzt die offizielle Ruff-Action (sehr schnell, benötigt kein uv-Setup im Vorfeld)
      - name: Run Ruff Check
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.17.2"
          args: check

      - name: Check Ruff Format
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.17.2"
          args: "format --check"
