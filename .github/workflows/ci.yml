name: CI

on:
  push:
    branches:
      - main
      - week/**
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff check
        run: uv run ruff check

      - name: Check Ruff format
        run: uv run ruff format --check

      - name: Check types
        run: uv run pyright

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest discover -s tests -p 'test*.py'

      - name: Measure coverage
        run: uv run coverage run -m unittest discover -s tests -p 'test*.py'

      - name: Report coverage
        run: uv run coverage report
