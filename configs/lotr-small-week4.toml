# Lauf Nr. 2: die Einstellungen aus Woche 4 auf dem Cluster, dazu GPT-2 original.
# Erwartet: Test-Loss 3,63 für GPT-2 original und ungefähr 4,35 von Grund auf
# (docs/cluster-training.md, Teil 3).
#   sbatch slurm/train.sbatch --config configs/lotr-small-week4.toml

name = "lotr-small-week4"
group = "week6-week4"
seed = 123
model_class = "GPTModel"
evaluate_pretrained = true  # braucht data/gpt2-small-124M.pth, siehe setup.sh
save_checkpoint = true
report = true

[data]
file = "The-lord-of-the-rings.txt"
start_line = "PROLOGUE"
end_line = "APPENDIX A"
book_title = "THE LORD OF THE RINGS"
train_ratio = 0.8
val_ratio = 0.1
seq_len = 256

[model]  # GPT-2 Small mit 256 Tokens Kontext wie in Woche 4
vocab_size = 50257
context_length = 256
emb_dim = 768
n_heads = 12
n_layers = 12
drop_rate = 0.1
qkv_bias = true

[train]
batch_size = 8
learning_rate = 4e-4
epochs = 4
weight_decay = 0.1
grad_clip = 1.0
eval_every = 100
precision = "fp16-mixed"
compile_backend = "none"
fused_adamw = false

[generation]
prompt = "The Elves are"
samples = 3
max_new_tokens = 40
temperature = 0.8
top_k = 40
