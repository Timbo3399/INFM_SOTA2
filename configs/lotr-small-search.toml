# Lauf Nr. 4: Suche nach Lernrate und Batchgröße, 1 Epoche je Kombination, ohne
# Checkpoint und ohne Test-Loss. 12 Aufgaben im Job-Array, höchstens 4 gleichzeitig:
#   sbatch slurm/search.sbatch
# Jede Aufgabe ersetzt Lernrate, Batchgröße und Epochen unter [train] durch ihre
# Kombination aus [search] (--grid-index, zeilenweise über die Lernraten).

name = "lotr-small-search"
group = "week6-search"
seed = 123
model_class = "GPTModelV2"
evaluate_pretrained = false
save_checkpoint = false
report = false

[data]
file = "The-lord-of-the-rings.txt"
start_line = "PROLOGUE"
end_line = "APPENDIX A"
book_title = "THE LORD OF THE RINGS"
train_ratio = 0.8
val_ratio = 0.1
seq_len = 256

[model]  # GPT-2 Small mit 256 Tokens Kontext wie in Woche 4
vocab_size = 50257
context_length = 256
emb_dim = 768
n_heads = 12
n_layers = 12
drop_rate = 0.1
qkv_bias = true

[train]
batch_size = 8  # ersetzt durch [search]
learning_rate = 4e-4  # ersetzt durch [search]
epochs = 1  # ersetzt durch [search]
weight_decay = 0.1
grad_clip = 1.0
eval_every = 100
precision = "bf16-mixed"
compile_backend = "inductor"
fused_adamw = true

[generation]
prompt = "The Elves are"
samples = 3
max_new_tokens = 40
temperature = 0.8
top_k = 40

[search]
learning_rates = [1e-4, 3e-4, 1e-3, 3e-3]
# 128 ist ein Platzhalter: Passt die Batchgröße laut Lauf Nr. 1 nicht in den
# Speicher der L40S, die größte Zweierpotenz eintragen, die passt.
batch_sizes = [8, 32, 128]
epochs = 1
