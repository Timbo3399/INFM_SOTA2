[project]
name = "infm-sota2"
version = "0.1.0"
description = "LLM von Grund auf in PyTorch – Gruppenprojekt SOTA 2, HS Offenburg"
readme = "README.md"
requires-python = ">=3.12,<3.14"          # Colab: aktuell 3.13, ältere Laufzeit 2026.07 = 3.12
dependencies = [
    # An die Colab-Laufzeit gekoppelt (github.com/googlecolab/backend-info).
    # Nur zusammen mit Colab anheben.
    "torch==2.14.1",
    "tiktoken==0.14.0",
    "wandb==0.28.1",
]

[dependency-groups]
dev = [
    # Nur für Notebooks (Hugging-Face-Datensätze in workbook_marvin_training_v1)
    "datasets>=5.1.0",
    "ipykernel",
    "ipywidgets",
    "matplotlib",
    "pandas",
    "requests",
    "ruff==0.17.2",
    "pyright==1.1.414",
    "coverage==7.17.0",
    "nbformat>=5.11.1",
]

[tool.uv]
required-version = ">=0.13"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
include = [
    "src/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
